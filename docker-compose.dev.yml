# Docker Compose for Local Development
# Usage: docker compose -f docker-compose.dev.yml up

version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: beautyhub_dev_postgres
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: saas_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: beautyhub_dev_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata_dev:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: beautyhub_dev_mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    restart: unless-stopped

volumes:
  pgdata_dev:
    name: beautyhub_dev_postgres_data
  redisdata_dev:
    name: beautyhub_dev_redis_data

