name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/beautyhub

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service: [api, web, worker]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=prod-
            type=raw,value=latest
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.service == 'worker' && 'api' || matrix.service }}
          file: ./apps/${{ matrix.service == 'worker' && 'api' || matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-to: type=inline
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

  deploy-production:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://saas.akylman.online
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create backup before deployment
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh $PRODUCTION_USER@$PRODUCTION_HOST << 'EOF'
            cd /opt/beautyhub
            
            # Run backup script
            ./infra/scripts/backup.sh
            
            echo "✅ Pre-deployment backup completed"
          EOF
      
      - name: Deploy via SSH
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh $PRODUCTION_USER@$PRODUCTION_HOST << 'EOF'
            cd /opt/beautyhub
            
            # Pull latest code (for docker-compose.yml updates)
            git pull origin main
            
            # Pull latest images
            docker compose pull
            
            # Stop services gracefully
            docker compose stop
            
            # Run migrations before starting (to avoid downtime with migration errors)
            docker compose run --rm api python manage.py migrate --check
            docker compose run --rm api python manage.py migrate
            
            # Start services with new images
            docker compose up -d
            
            # Wait for services to be healthy
            sleep 15
            
            # Verify deployment
            docker compose ps
            
            # Check health endpoint
            curl -f http://localhost:8000/health/ || exit 1
            
            # Restart Celery workers to pick up new code
            docker compose restart worker beat
            
            echo "✅ Production deployment completed!"
          EOF
      
      - name: Health check
        run: |
          sleep 10
          curl -f https://saas.akylman.online/health/ || exit 1
          echo "✅ Health check passed"
      
      - name: Smoke tests
        run: |
          # Test main page
          curl -f https://saas.akylman.online/ || exit 1
          
          # Test API health
          curl -f https://saas.akylman.online/api/health/ || exit 1
          
          echo "✅ Smoke tests passed"
      
      - name: Rollback on failure
        if: failure()
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh $PRODUCTION_USER@$PRODUCTION_HOST << 'EOF'
            cd /opt/beautyhub
            
            echo "⚠️  Deployment failed, rolling back..."
            
            # Rollback to previous images
            docker compose down
            git checkout HEAD~1
            docker compose up -d
            
            echo "✅ Rollback completed"
          EOF
      
      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Production deployment ${{ job.status }}
            Version: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Changes in this release
            
            See [CHANGELOG.md](CHANGELOG.md) for details.
            
            ## Docker Images
            
            - `ghcr.io/${{ env.IMAGE_PREFIX }}-api:${{ github.ref_name }}`
            - `ghcr.io/${{ env.IMAGE_PREFIX }}-web:${{ github.ref_name }}`
            - `ghcr.io/${{ env.IMAGE_PREFIX }}-worker:${{ github.ref_name }}`
          draft: false
          prerelease: false

