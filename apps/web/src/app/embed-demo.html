<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautyHub Widget Demo</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .code-block {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            overflow-x: auto;
        }
        .code-block code {
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        #booking-widget {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 BeautyHub Booking Widget Demo</h1>
        <p>Пример встраивания виджета онлайн-записи на ваш сайт</p>
        
        <h2>Как встроить виджет</h2>
        <p>Добавьте эти две строки на ваш сайт:</p>
        
        <div class="code-block">
            <code>&lt;script src="https://demo-salon.saas.akylman.online/widget.js"&gt;&lt;/script&gt;<br>
&lt;div id="booking-widget"&gt;&lt;/div&gt;</code>
        </div>
        
        <h2>Пример работы виджета:</h2>
        
        <!-- Widget embed -->
        <div id="booking-widget"></div>
        
        <script src="https://demo-salon.saas.akylman.online/widget.js"></script>
        
        <script>
            // Listen for booking success event
            window.addEventListener('beautyhub-booking-success', function(event) {
                console.log('Booking created:', event.detail);
                alert('Запись успешно создана! ID: ' + event.detail.id);
            });
        </script>
    </div>
</body>
</html>
